services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automateflow
      POSTGRES_USER: automateflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automateflow -d automateflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://automateflow:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/automateflow
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
